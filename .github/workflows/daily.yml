name: Daily data

# Every 6 hours: collect today's snapshot (only the first successful run of a
# UTC day does any work; the rest are retries), check for a patch reset,
# commit the snapshot, rebuild the dataset and redeploy the site. Pushes to
# main only rebuild and redeploy.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install curl_cffi

      - name: Collect today's snapshot
        run: python analysis/collect_live.py

      - name: Detect patch changes
        run: python analysis/detect_patch.py
        env:
          ISSUE_OUT: ${{ runner.temp }}/issue.json

      - name: Open an issue if something needs a human
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ runner.temp }}/issue.json
        run: |
          if [ -f "$ISSUE" ]; then
            gh issue create --title "$(jq -r .title "$ISSUE")" --body "$(jq -r .body "$ISSUE")"
          fi

      - name: Commit snapshot and patch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot $(date -u +%F)"
            git pull --rebase
            git push
          fi

      # A single failed run is normal (e.g. a temporary 403 from Nexon) and is
      # retried 6 hours later; snapshots are cumulative, so nothing is lost.
      # Only when no snapshot has been committed for today or yesterday, i.e. a
      # whole UTC day was missed, does it need a human.
      - name: Open an issue if a whole day of collection was missed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Data collection failing"
        run: |
          today=$(date -u +%F); yesterday=$(date -u -d yesterday +%F)
          for day in "$today" "$yesterday"; do
            if git cat-file -e "HEAD:data/snapshots/$day.json.gz" 2>/dev/null; then
              echo "Snapshot for $day is committed; a single failed run doesn't need an issue."
              exit 0
            fi
          done
          newest=$(git ls-files 'data/snapshots/*.json.gz' | sort | tail -1)
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "$TITLE" --body "No snapshot has been committed for a full UTC day (newest: \`$newest\`). Runs retry every 6 hours; one-off failures don't open this issue, so this one means collection has kept failing. Snapshots are cumulative since the patch started, so nothing is lost if it recovers before the patch ends. Latest failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. This issue closes itself when collection works again."
          fi

      - name: Close the collection issue once it works again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Data collection failing"
        run: |
          for n in $(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Collection works again (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          done

  deploy:
    needs: collect
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # includes the snapshot the collect job just pushed

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # If either check fails, nothing below runs: the site keeps its last
      # good version and an issue is opened.
      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build dataset
        run: python analysis/build_dataset.py

      - name: Check the dataset
        run: python analysis/validate_dataset.py

      # Published on the site rather than committed, so they're always current
      # and the charts (~2 MB per refresh) don't pile up in git history.
      - name: Report, CSVs and charts
        run: |
          python analysis/report.py
          python analysis/charts.py
          python analysis/render_report.py

      - name: Assemble site
        run: |
          mkdir -p _site/data _site/report
          cp -r index.html web charts _site/
          cp -r data/csv _site/data/
          cp data/web_data.json _site/data/
          cp report/index.html _site/report/
          # Version the asset links so browsers never pair a new page with a
          # cached old script (Pages caches files for ~10 minutes).
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/web/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Open an issue if the deploy was blocked or failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Site not updated: deploy blocked or failed"
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "$TITLE" --body "The site still shows its last good version. Either the tests or data checks failed (deploy blocked on purpose) or the deploy itself failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
